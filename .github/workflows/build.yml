name: Build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Download dependencies
        run: go mod download
      - name: Test
        run: go test ./...
      - name: Build
        run: CGO_ENABLED=1 go build -trimpath -ldflags="-s -w" -o puredos ./cmd/puredos
